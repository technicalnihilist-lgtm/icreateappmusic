name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'icreate_music/**'
      - '.github/workflows/android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Bundle the Python engine into the APK
        run: |
          mkdir -p mobile/app/src/main/python
          rm -rf mobile/app/src/main/python/icreate_music
          cp -r icreate_music mobile/app/src/main/python/icreate_music
          find mobile/app/src/main/python -name '__pycache__' -prune -exec rm -rf {} +
          find mobile/app/src/main/python -name '*.pyc' -delete

      - name: Build debug APK
        working-directory: mobile
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp mobile/app/build/outputs/apk/debug/*.apk dist/icreate-music.apk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: icreate-music-apk
          path: dist/icreate-music.apk
          if-no-files-found: error
