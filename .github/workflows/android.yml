name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'icreate_music/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licences (preinstalled SDK)
        run: |
          echo "SDK at: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_HOME" > mobile/local.properties

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Bundle the Python engine into the APK
        run: |
          mkdir -p mobile/app/src/main/python
          rm -rf mobile/app/src/main/python/icreate_music
          cp -r icreate_music mobile/app/src/main/python/icreate_music
          find mobile/app/src/main/python -name '__pycache__' -prune -exec rm -rf {} +
          find mobile/app/src/main/python -name '*.pyc' -delete

      - name: Build debug APK
        working-directory: mobile
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp mobile/app/build/outputs/apk/debug/*.apk dist/icreate-music.apk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: icreate-music-apk
          path: dist/icreate-music.apk
          if-no-files-found: error

      # Keeps one rolling release so the download URL never changes:
      # https://github.com/<owner>/<repo>/releases/latest/download/icreate-music.apk
      - name: Publish to rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: iCreate Music — APK (latest)
          body: |
            Debug-signed APK, built from commit ${{ github.sha }}.

            Bundles CPython 3.11 + numpy + the iCreate Music engine, so songs are
            rendered on the device with no server and no network.

            Install: enable "install unknown apps" for your browser/file manager,
            open the APK, tap Install. First launch takes 10–30 s while Python
            unpacks.
          files: dist/icreate-music.apk
          make_latest: true
