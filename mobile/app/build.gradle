plugins {
    id 'com.android.application' version '8.5.2'
    id 'com.chaquo.python' version '16.0.0'
}

android {
    namespace "com.icreate.music"
    compileSdk 34

    defaultConfig {
        applicationId "com.icreate.music"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            // phones only: keeps the APK small
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version "3.11"
        pip {
            install "numpy"
        }
    }
}

configurations.all {
    // Chaquopy ships kotlin-stdlib 1.8.x; androidx ships a newer one. The
    // jdk7/jdk8 artifacts are merged into stdlib since 1.8, so pin one copy.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
}
